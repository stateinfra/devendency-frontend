services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devlog
      POSTGRES_PASSWORD: devlog
      POSTGRES_DB: devlog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlog -d devlog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
